[package]
name = "intellinote-asr"
version = "0.1.0"
description = "IntelliNote on-device speech recognition sidecar (sherpa-onnx). Talks to the app over stdin/stdout only."
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "intellinote-asr"
path = "src/main.rs"

# Pinned exactly: a runtime upgrade can change decoding silently, so bumps go
# through the golden-audio WER test (see docs/transcription-phase0-plan.md §7).
[dependencies]
sherpa-onnx = "=2.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# Default features cover the royalty-free codecs; aac/isomp4/mp3 cover typical lecture recordings.
symphonia = { version = "=0.6.1", features = ["aac", "isomp4", "mp3", "alac"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "=1.0.154"
