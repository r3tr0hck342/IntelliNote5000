name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Verify release
        run: npm run verify:release

  desktop-compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libasound2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/asr
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build ASR sidecar
        # tauri-build requires the externalBin sidecar to exist before the app crate compiles.
        run: node tools/build-asr.mjs
      - name: Rust tests (sidecar + app)
        # generate_context! requires frontendDist to exist; the web build is checked in release-gate.
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/asr/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  desktop-compile-macos-windows:
    # Native capture (cpal: Core Audio tap / WASAPI loopback) and the sidecar must build and pass
    # their tests on every desktop OS, not just Linux.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/asr
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build ASR sidecar
        run: node tools/build-asr.mjs
      - name: Rust tests (sidecar + app)
        shell: bash
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/asr/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        # Pinned to v3.0.0 by commit SHA. No license is needed for personal-account repos.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
